name: Deploy GitBook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-warmup
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build with HonKit
        run: npx --yes honkit@6.2.5 build . _book

      - name: Rewrite absolute asset paths for sub-path
        run: |
          find _book -name "*.html" -exec sed -i \
            's|"/gitbook/|"/warmup-course/gitbook/|g; s|src="/gitbook/|src="/warmup-course/gitbook/|g; s|href="/gitbook/|href="/warmup-course/gitbook/|g' {} +

      - name: Add .nojekyll
        run: touch _book/.nojekyll

      # 主通道：产物推到 gh-pages 分支。
      # Pages 发布源设为「Deploy from a branch → gh-pages → /」时，这一支就是发布源。
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          publish_branch: gh-pages
          force_orphan: true

      # 备用通道：Pages 发布源设为「GitHub Actions」时走这条路。
      # GITHUB_TOKEN 通常无权创建 Pages 站点（Resource not accessible by integration），
      # 所以这里 continue-on-error，让「分支部署」模式下任务仍然是绿的。
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Upload artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_book

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
        continue-on-error: true
